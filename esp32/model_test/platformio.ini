[platformio]
default_envs = esp32-s3-model-test

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:esp32-s3-model-test]
build_flags = -I../../ml/models/uci_beijing_6h/esp32_student/export

[env:india-five-sensor-test]
build_flags = -I../../ml/models/india_cpcb_5sensor_6h/esp32_student/export

[env:india-pm-test]
build_flags = -I../../ml/models/india_cpcb_pm_6h/esp32_student/export
