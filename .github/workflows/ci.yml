name: ML CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ruff mypy

      - name: Run ruff (Python linting)
        run: |
          ruff check ml/ --exit-zero

      - name: Run mypy (type checking)
        run: |
          mypy ml/ --ignore-missing-imports || true

  verify-model:
    name: Verify ML Model Export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check model artifacts exist
        run: |
          test -f ml/model/feature_names.json
          test -f ml/model/normalization.json
          test -f ml/model/metrics.json
          test -f ml/model/xgboost_wildfire.json
          test -f ml/model/xgboost_flood.json
          test -f ml/model/xgboost_storm.json
          test -f ml/model/xgboost_air_quality.json
          test -f ml/generated/model_data.h
          echo "Model artifacts present"

      - name: Verify model constants in generated header
        run: |
          python3 -c "
          with open('ml/generated/model_data.h') as f:
              content = f.read()
          assert 'NUM_CLASSES' in content
          assert 'NUM_FEATURES' in content
          assert 'WILDFIRE_NUM_TREES' in content
          print('Model constants verified')
          "

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check docs structure
        run: |
          test -f ml/docs/ML_PIPELINE.md
          test -f ml/docs/ML_INFERENCE.md
          echo "All docs present"

      - name: Check markdown lint
        run: |
          pip install markdownlint-cli
          markdownlint ml/docs/ --disable MD013 MD033
