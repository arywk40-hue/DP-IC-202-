name: Model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies and lint tools
        run: python -m pip install -r requirements-physics.txt -r requirements-hazard-context.txt -r requirements-operational.txt xgboost==3.1.1 ruff==0.16.10
      - name: Lint model code
        run: ruff check ml/six_sensor_forecast ml/event_classifier ml/deployment ml/datasets ml/spatial_ensemble ml/field ml/india_sensor ml/hazard_context ml/operational tests esp32/ml_integration/tools --select E9,F63,F7,F82
      - name: Run model, data contract and compiled C parity tests
        run: python -m pytest -q

  esp32-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('esp32/**/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build isolated ESP32-S3 model test
        run: pio run -d esp32/model_test
      - name: Build six-channel forecast and event integration (UART and native USB)
        run: pio run -d esp32/ml_integration -e esp32-s3-ml -e esp32-s3-ml-usb

      - name: Build India sensor research export (compile only)
        run: pio run -d esp32/india_sensor

      - name: Build operational sensor driver preparation (physical mode disabled)
        run: pio run -d esp32/operational_node
