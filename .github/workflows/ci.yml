name: Firmware CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IDF_VERSION: v5.4
  IDF_TARGET: esp32s3

jobs:
  # 1. Code Quality Checks
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install -r code/ml/requirements.txt 2>/dev/null || pip install xgboost scikit-learn pandas numpy

      - name: Run Python linters
        run: |
          pip install ruff mypy
          ruff check code/
          mypy code/ --ignore-missing-imports

      - name: Check C formatting
        run: |
          # Verify .clang-format exists
          if [ -f .clang-format ]; then
            find firmware -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror
          fi

  # 2. Firmware Build
  build:
    name: Build Firmware (ESP-IDF ${{ env.IDF_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          install_tools: true

      - name: Configure target
        run: |
          cd firmware
          idf.py set-target ${{ env.IDF_TARGET }}

      - name: Build
        run: |
          cd firmware
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
          retention-days: 7

      - name: Size report
        run: |
          cd firmware
          idf.py size

  # 3. Model Verification
  verify-model:
    name: Verify ML Model Export
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install xgboost scikit-learn pandas numpy

      - name: Check model headers exist
        run: |
          test -f firmware/components/ml/include/model_data.h
          test -f firmware/components/ml/include/normalization.h
          test -f firmware/components/ml/include/model_metadata.h
          echo "Model headers present"

      - name: Verify model constants
        run: |
          python3 -c "
          import re
          with open('firmware/components/ml/include/model_data.h') as f:
              content = f.read()
          # Check key constants
          assert 'NUM_CLASSES 4' in content
          assert 'NUM_FEATURES 14' in content
          assert 'WILDFIRE_NUM_TREES' in content
          assert 'NORM_MEAN' in content
          assert 'NORM_STD' in content
          print('Model constants verified')
          "

  # 4. Unit Tests (simulated)
  unit-tests:
    name: Unit Tests (Simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest pytest-xdist

      - name: Run acceptance tests (simulation)
        run: |
          python code/acceptance_test.py --node SIM --simulate --output ./test-results/
        # Note: This will pass in simulation mode

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # 5. Documentation Check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs structure
        run: |
          # Verify all expected docs exist
          test -f docs/index.md
          test -f docs/guides/QUICK_START.md
          test -f docs/guides/BUILD_GUIDE.md
          test -f docs/guides/FLASH_GUIDE.md
          test -f docs/guides/ML_PIPELINE.md
          test -f docs/reference/SENSORS.md
          test -f docs/reference/MESH_PROTOCOL.md
          test -f docs/reference/ML_INFERENCE.md
          test -f docs/reference/FIRMWARE_API.md
          test -f docs/reference/PIN_MAP.md
          test -f docs/planning/PROJECT_STATUS.md
          test -f docs/planning/FOUR_MONTH_BUILD_PLAN.md
          test -f docs/planning/ACCEPTANCE_TESTS.md
          test -f docs/architecture/SYSTEM_ARCHITECTURE.md
          echo "All docs present"

      - name: Check markdown lint
        run: |
          pip install markdownlint-cli
          markdownlint docs/ --disable MD013 MD033

  # 6. Final Gate
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [lint, build, verify-model, unit-tests, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed - ready for release"

      - name: Create release tag
        if: github.event_name == 'push'
        run: |
          VERSION=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"