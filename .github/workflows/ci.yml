name: Model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies and lint tools
        run: python -m pip install -r ml/requirements/requirements-physics.txt -r ml/requirements/requirements-hazard-context.txt -r ml/requirements/requirements-operational.txt -r server/requirements.txt -r ml/requirements/requirements-online-research.txt -r ml/requirements/requirements-storm-risk.txt ruff==0.16.10
      - name: Lint model code
        run: ruff check ml server contracts/scripts contracts/tests docs/tests simulator esp32/ml_integration/tools --select E9,F63,F7,F82
      - name: Run model, data contract and compiled C parity tests
        run: python -m pytest -q
      - name: Verify committed shipping exports without source datasets
        run: python -m ml.deployment.verify_exports --catalog ml/configs/model_catalog.json --output ml/reports/deployment/committed_export_verification.json --offline

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -r server/requirements.txt
      - run: npm ci --no-fund --no-audit
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm test && npm run test:e2e
        working-directory: ui

  esp32-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('esp32/**/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build isolated ESP32-S3 model test
        run: pio run -d esp32/model_test
      - name: Build six-channel forecast and event integration (UART and native USB)
        run: pio run -d esp32/ml_integration -e esp32-s3-ml -e esp32-s3-ml-usb

      - name: Build India sensor research export (compile only)
        run: pio run -d esp32/india_sensor

      - name: Build operational sensor driver preparation (physical mode disabled)
        run: pio run -d esp32/operational_node

      - name: Build isolated Himachal research node (physical mode disabled)
        run: pio run -d esp32/himachal_node
