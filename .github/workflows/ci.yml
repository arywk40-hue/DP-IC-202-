name: ESP-IDF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IDF_VERSION: v5.4
  IDF_TARGET: esp32s3

jobs:
  # Code quality checks
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install linters
        run: |
          pip install ruff mypy clang-format
          
      - name: Run ruff (Python linting)
        run: |
          ruff check code/ --exit-zero
          
      - name: Run mypy (type checking)
        run: |
          mypy code/ --ignore-missing-imports || true
          
      - name: Check C formatting
        run: |
          find firmware -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror
          
  # Firmware build
  build:
    name: Build Firmware (ESP-IDF ${{ env.IDF_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          install_tools: true
          
      - name: Configure target
        run: |
          cd firmware
          idf.py set-target ${{ env.IDF_TARGET }}
          
      - name: Build firmware
        run: |
          cd firmware
          idf.py build
          
      - name: Size analysis
        run: |
          cd firmware
          idf.py size > size_output.txt
          python3 ../scripts/size_report.py size_output.txt size_report.md
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
          retention-days: 7
          
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: firmware/size_report.md
          retention-days: 7

  # Model verification
  verify-model:
    name: Verify ML Model Export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install xgboost scikit-learn pandas numpy
          
      - name: Check model headers exist
        run: |
          test -f firmware/components/ml/include/model_data.h
          test -f firmware/components/ml/include/normalization.h
          test -f firmware/components/ml/include/model_metadata.h
          echo "Model headers present"
          
      - name: Verify model constants match firmware
        run: |
          python3 -c "
          import re
          with open('firmware/components/ml/include/model_data.h') as f:
              content = f.read()
          assert 'NUM_CLASSES 4' in content
          assert 'NUM_FEATURES 14' in content
          assert 'WILDFIRE_NUM_TREES' in content
          assert 'NORM_MEAN' in content
          assert 'NORM_STD' in content
          print('Model constants verified')
          "

  # Unit tests (simulation mode)
  unit-tests:
    name: Unit Tests (Simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          install_tools: true
          
      - name: Run crypto tests
        run: |
          cd firmware
          idf.py -DTEST_COMPONENT=crypto build
          
      - name: Run mesh tests
        run: |
          cd firmware
          idf.py -DTEST_COMPONENT=mesh build

  # Documentation check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Check docs structure
        run: |
          test -f docs/index.md
          test -f docs/architecture/SYSTEM_ARCHITECTURE.md
          test -f docs/guides/QUICK_START.md
          test -f docs/guides/BUILD_GUIDE.md
          test -f docs/guides/FLASH_GUIDE.md
          test -f docs/guides/ML_PIPELINE.md
          test -f docs/reference/SENSORS.md
          test -f docs/reference/MESH_PROTOCOL.md
          test -f docs/reference/ML_INFERENCE.md
          test -f docs/reference/FIRMWARE_API.md
          test -f docs/reference/PIN_MAP.md
          test -f docs/planning/PROJECT_STATUS.md
          test -f docs/planning/FOUR_MONTH_BUILD_PLAN.md
          test -f docs/planning/ACCEPTANCE_TESTS.md
          echo "All docs present"
          
      - name: Check markdown lint
        run: |
          pip install markdownlint-cli
          markdownlint docs/ --disable MD013 MD033

  # Final gate
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [lint, build, verify-model, unit-tests, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed - ready for release"
        
      - name: Create release tag
        run: |
          VERSION=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}