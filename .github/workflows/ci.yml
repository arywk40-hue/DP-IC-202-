name: Model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install model dependencies and lint tools
        run: python -m pip install -r requirements.txt ruff
      - name: Lint model code
        run: ruff check ml/six_sensor_forecast tests --select E9,F63,F7,F82
      - name: Run model, data contract and compiled C parity tests
        run: python -m unittest discover -s tests

  esp32-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('esp32/model_test/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build isolated ESP32-S3 model test
        run: pio run -d esp32/model_test
