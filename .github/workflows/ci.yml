name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ml-quality:
    name: Python and model contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: python -m pip install ruff

      - name: Check Python syntax
        run: python -m compileall -q ml

      - name: Lint Python
        run: ruff check ml

      - name: Compile and run promoted C model
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Iml/generated tests/model/test_model_smoke.c -lm \
            -o /tmp/model_smoke
          /tmp/model_smoke

  firmware:
    name: Firmware host test and ESP32-S3 build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Run native firmware tests
        run: pio test -d firmware -e native

      - name: Build ESP32-S3 firmware
        run: pio run -d firmware -e esp32-s3-devkitc-1

